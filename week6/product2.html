<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Online Shop</title>

    <style>
        body{
            font-family: Arial;
            margin:0;
            background: #f5f5f5;
        }

        header{
            background: #222;
            color: white;
            text-align:center;
            padding:15px;
        }

        .container{
            display:flex;
        }

        .products{
            width:75%;
            display:flex;
            flex-wrap:wrap;
            padding:20px;
        }

        .product{
            background: white;
            border-radius:8px;
            box-shadow:0 0 5px rgba(0,0,0,0.2);
            width:220px;
            margin:15px;
            padding:15px;
            text-align:center;
        }

        .product img{
            width:200px;
            height:200px;
            object-fit:cover;
            border-radius:5px;
        }

        button{
            background: #28a745;
            color: white;
            border:none;
            padding:8px 12px;
            cursor:pointer;
            margin-top:5px;
        }

        .sidebar{
            width:25%;
            background:#333;
            color: white;
            padding:20px;
        }

        .sidebar button{
            width:100%;
            margin-top:10px;
        }

        .total{
            font-size:18px;
            margin:8px 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>My Online Shop</h1>
    </header>

    <div class="container">
        <div class="products">
            
            <div class="product">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff">
                <h3>Running Shoes</h3>
                <p>Price: $50</p>
                <p class="total">Total Amount: $<span id="total1">0</span></p>
                <button onclick="addToCart(50)">Add to Cart</button>
            </div>

            <div class="product">
                <img src="https://images.unsplash.com/photo-1518091043644-c1d4457512c6">
                <h3>Football</h3>
                <p>Price: $35</p>
                <p class="total">Total Amount: $<span id="total2">0</span></p>
                <button onclick="addToCart(35)">Add to Cart</button>
            </div>

            <div class="product">
                <img src="file:///C:/Users/RHISHIRAJ/Downloads/OIP.webp">
                <h3>Badminton Racket</h3>
                <p>Price: $20</p>
                <p class="total">Total Amount: $<span id="total3">0</span></p>
                <button onclick="addToCart(20)">Add to Cart</button>
            </div>

        </div>

        <div class="sidebar">
            <h2>Checkout</h2>
            <p class="total">Total Amount: $<span id="grandTotal">0</span></p>
            <button onclick="orderNow()">Order Now</button>
            <button onclick="cancelOrder()">Cancel</button>
        </div>
    </div>

    <script>
        let total = 0;

        function addToCart(price){
            total += price;
            document.getElementById("grandTotal").innerText = total;
        }

        function orderNow(){
            alert("Order placed! Total Amount: $" + total);
        }

        function cancelOrder(){
            total = 0;
            document.getElementById("grandTotal").innerText = total;
            alert("Order Cancelled");
        }
    </script>

</body>
</html>
