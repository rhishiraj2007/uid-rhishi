<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Number Tasks</title>
    <style>
        body { 
            font-family: sans-serif; 
            margin: 20px auto; 
            max-width: 600px;
            line-height: 1.6; 
        }
        .task-container { 
            border: 1px solid #ccc; 
            padding: 20px; 
            margin-bottom: 20px; 
            border-radius: 8px; 
            background-color: #f9f9f9;
        }
        button { 
            padding: 10px 15px; 
            font-size: 14px; 
            cursor: pointer; 
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .even { color: blue; font-weight: bold; margin: 2px 0;}
        .odd { color: red; font-weight: bold; margin: 2px 0;}
    </style>
</head>
<body>

    <h1>JavaScript Tasks</h1>

    <div class="task-container">
        <h2>1. Sort 3 Numbers</h2>
        <p>Sorts the numbers: <strong>42, 15, 89</strong></p>
        <button onclick="runSort()">Show Sorted Numbers (Alert)</button>
    </div>

    <div class="task-container">
        <h2>2. Find Biggest of 5 Numbers</h2>
        <p>Finds the largest among: <strong>12, 45, 7, 89, 34</strong></p>
        <button onclick="runFindBiggest()">Show Biggest Number (Alert)</button>
    </div>

    <div class="task-container">
        <h2>3. Even or Odd (0 to 15)</h2>
        <p>Iterates from 0 to 15 and prints the result to the screen.</p>
        <button onclick="runEvenOdd()">Display Even/Odd Sequence</button>
        
        <div id="resultBox" style="margin-top: 15px;"></div>
    </div>

    <script>
        function runSort() {
            let numbers = [42, 15, 89];
            numbers.sort((a, b) => a - b);
            alert("The sorted numbers are: " + numbers.join(", "));
        }

        function runFindBiggest() {
            let biggest = Math.max(12, 45, 7, 89, 34);
            alert("The biggest number is: " + biggest);
        }

        function runEvenOdd() {
            let displayArea = document.getElementById("resultBox");
            let resultHTML = ""; // Start with an empty string
            
            for (let i = 0; i <= 15; i++) {
                if (i % 2 === 0) {
                    resultHTML += "<p class='even'>" + i + " is even</p>";
                } else {
                    resultHTML += "<p class='odd'>" + i + " is odd</p>";
                }
            }
            displayArea.innerHTML = resultHTML;
        }
    </script>

</body>
</html>
