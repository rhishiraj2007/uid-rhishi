<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8a</title>
    <style>
        body{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #272727;
        }
        .container{
            width:750px;
            height:450px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 10%;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            box-shadow: 0 0 10px;
        }
        .square{
            width:150px;
            height:300px;
            background-color:#D4AA7D;
            position:absolute;
            border-radius: 5px;
            animation: animation1;
            animation-duration:3s;
            animation-delay: 1s;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
            box-shadow: 0 0 5px;
        }
        @keyframes animation1{
            from{transform : rotate(0deg);}
            to{transform: rotate(360deg);}
        }
        
    </style>
</head>
<body>
    <p style="color: #D4AA7D;">Rhishiraj Thalakkat CSE25147</p>
    <div class="container">
        <div class="square"></div>
    </div>

</body>
</html>
