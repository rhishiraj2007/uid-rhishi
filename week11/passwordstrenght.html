<html>
    <head>
        <title>Validation</title>
    </head>
    <body>
        UserName:<input type="text" Id="username" onkeyup="validation()">
        <p id="msg"></p>
        <script>
            function validation() {
                value = document.getElementById("username").value;
                if (value.length >5 & value.length < 10) {
                    document.getElementById("msg").innerHTML = "Moderate password.";
                    document.getElementById("msg").style.color = "orange";
                } else if (value.length < 5) {
                    document.getElementById("msg").innerHTML = "Weak password.";
                    document.getElementById("msg").style.color = "red";
                }else {
                    document.getElementById("msg").innerHTML = "Strong password.";
                    document.getElementById("msg").style.color = "green";
                }
            }
        </script>
    </body>
</html>
