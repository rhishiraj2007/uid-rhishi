<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8b</title>
        <style>
        body{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #272727;
        }
        .container{
            width:300px;
            height:500px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 8%;
            background-color:rgba(0,0,0,0.2);
            border-radius: 10px;
            box-shadow: 0 0 10px;
        }
        .ball{
            width:100px;
            height:100px;
            background-color:#D4AA7D;
            position:absolute;
            border-radius: 50%;
            animation: animation1;
            animation-duration:3s;
            animation-delay: 1s;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
            box-shadow: 0 0 5px;
        }
                .author {
            color: #D4AA7D;;
                }
                
        @keyframes animation1{
            0%{transform : translateY(0px)}
            25%{transform : translateY(-200px)}
            50%{transform : translateY(0px)}
            75%{transform: translateY(200px)}
            100%{transform :translateY(0px)}
        }
    </style>
    </head>
    <body>
        <p>Rhishiraj Thalakkat CSE25147</p>
        <div class="container">
            <div class="ball"></div>
        </div>

    </body>
</html>
