<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>8c</title>
        <style>
        body{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #272727;
        }
        .container{
            width:500px;
            height:300px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 15%;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            box-shadow: 0 0 10px;
        }
        .ball{
            width:100px;
            height:100px;
            background:linear-gradient(100deg,white,#D4AA7D);
            border:1px solid black;
            position:absolute;
            border-radius: 50%;
            animation: animation1;
            animation-duration:5s;
            animation-delay: 1s;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
        }
        @keyframes animation1{
            0%{transform : translateX(0px) rotate(0deg)}
            25%{transform : translateX(-200px) rotate(360deg)}
            50%{transform : translateX(0px) rotate(720deg)}
            75%{transform: translateX(200px) rotate(1080deg)}
            100%{transform :translateX(0px) rotate(1460deg)}
        }
        
    </style>
    </head>
    <body>
        <p style="color: #D4AA7D;">Rhishiraj Thalakkat CSE25147</p>
        <div class="container">
            <div class="ball"></div>
        </div>

    </body>
</html>
