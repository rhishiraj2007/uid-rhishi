<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Online Shop</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f5f5f5;
        }

        header {
            background: #222;
            color: white;
            text-align: center;
            padding: 15px;
        }

        .container {
            display: flex;
        }

        .products {
            width: 75%;
            display: flex;
            flex-wrap: wrap;
            padding: 20px;
        }

        .product {
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 5px rgba(0,0,0,0.2);
            width: 220px;
            margin: 15px;
            padding: 15px;
            text-align: center;
        }

        .product img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 5px;
        }

        button {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            margin-top: 5px;
        }

        .sidebar {
            width: 25%;
            background: #333;
            color: white;
            padding: 20px;
        }

        .sidebar button {
            width: 100%;
            margin-top: 10px;
        }

        .total {
            font-size: 18px;
            margin: 8px 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>My Online Shop</h1>
    </header>

    <div class="container">
        <div class="products">
            
            <div class="product">
                <img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853">
                <h3>Laptop</h3>
                <p>Price: $800</p>
                <p class="total">Total Amount: $<span id="total1">0</span></p>
                <button onclick="addToCart(800)">Add to Cart</button>
            </div>

            <div class="product">
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30">
                <h3>Smartwatch</h3>
                <p>Price: $150</p>
                <p class="total">Total Amount: $<span id="total2">0</span></p>
                <button onclick="addToCart(150)">Add to Cart</button>
            </div>

            <div class="product">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e">
                <h3>Headphones</h3>
                <p>Price: $100</p>
                <p class="total">Total Amount: $<span id="total3">0</span></p>
                <button onclick="addToCart(100)">Add to Cart</button>
            </div>

        </div>

        <div class="sidebar">
            <h2>Checkout</h2>
            <p class="total">Total Amount: $<span id="grandTotal">0</span></p>
            <button onclick="orderNow()">Order Now</button>
            <button onclick="cancelOrder()">Cancel</button>
        </div>
    </div>

    <script>
        let total = 0;

        function addToCart(price) {
            total += price;
            document.getElementById("grandTotal").innerText = total;
        }

        function orderNow() {
            alert("Order placed! Total Amount: $" + total);
        }

        function cancelOrder() {
            total = 0;
            document.getElementById("grandTotal").innerText = total;
            alert("Order Cancelled");
        }
    </script>

</body>
</html>
